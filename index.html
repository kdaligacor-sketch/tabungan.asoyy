<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabunganKu - Aplikasi Keuangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
